plugins {
    id 'com.android.library' version '8.2.2'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

// BareKit (the Bare runtime for Android) is NOT committed — see "BareKit native lib auto-fetch"
// below. Resolved up here because both the android {} block (jni libs) and the dependencies {}
// block (classes.jar) need the same directory, and -PbareKitDir must move both together.
def bareKitDir = file(project.findProperty('bareKitDir') ?: 'libs/bare-kit')
def bareKitClassesJar = new File(bareKitDir, 'classes.jar')
def bareKitTag = project.findProperty('bareKitTag')?.toString()

android {
    namespace 'to.tether.wdk.core'
    compileSdk 35

    defaultConfig {
        minSdk 31
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ["src/main/addons", new File(bareKitDir, 'jni')]
            assets.srcDirs += "src/main/assets"
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

// --- Bundler-based build tasks ---
// These re-run only when the JS side actually changes. Instead of guessing with
// onlyIf, we declare each task's inputs/outputs and let Gradle's own up-to-date
// check drive it: a task is skipped when its inputs+outputs are unchanged and
// re-run when they change. So editing only Kotlin skips the whole JS pipeline,
// while editing js/wdk.config.js, js/package.json or js/package-lock.json triggers
// a reinstall/regenerate and the Copy tasks recopy the fresh output. The lockfile
// is an input on purpose as without it existing checkouts would keep
// shipping the old node_modules in the bundle. (`bash -lc` runs a login shell so the
// nvm-managed Node is on PATH.) The ESM->CJS conversion (options.convertEsmToCjs
// in js/wdk.config.js) keeps the bundle CommonJS: V8, the only engine this library
// ships with, runs it as-is, and a CJS-only engine (JSC, QuickJS) would require it.
// See js/README.md.

tasks.register("npmInstall", Exec) {
    workingDir "js"
    commandLine "bash", "-lc", "npm install"
    inputs.file("js/package.json")
    inputs.file("js/package-lock.json")
    outputs.dir("js/node_modules")
}

tasks.register("generateBundle", Exec) {
    workingDir "js"
    commandLine "bash", "-lc", "npm run generate"
    dependsOn npmInstall
    inputs.file("js/wdk.config.js")
    inputs.file("js/package.json")
    inputs.file("js/package-lock.json")
    outputs.dir("js/.wdk-bundle")
    outputs.dir("js/android-addons")
}

// Copy tasks are incremental on their own: they recopy exactly when generateBundle
// produces new output and are skipped otherwise. copyAddons is a Sync, not a Copy:
// it makes src/main/addons match js/android-addons exactly, so an addon that a
// dependency bump or a removed wallet package no longer produces is deleted
// instead of staying behind as a stale .so in the APK.
tasks.register("copyAddons", Sync) {
    from "js/android-addons"
    into "src/main/addons"
    dependsOn generateBundle
}

tasks.register("copyBundle", Copy) {
    from "js/.wdk-bundle/wdk-worklet.bundle"
    into "src/main/assets"
    rename { "wdk.bundle" }
    dependsOn generateBundle
}

preBuild.dependsOn copyAddons, copyBundle

// --- BareKit native lib auto-fetch ---
// WdkCore.kt compiles against to.holepunch.bare.kit.* (classes.jar) and packages the per-ABI
// native libs (jni/) at runtime. Both come from BareKit's public GitHub releases
// (holepunchto/bare-kit) — no secrets, all Gradle-native (no gh/curl/unzip needed on the host).
// This runs at EXECUTION time only — never on an Android Studio Gradle sync — and is
// skipped whenever the lib already exists, so it's a one-time fetch per clone. On a fresh clone the
// IDE shows the BareKit imports unresolved until the first ./gradlew build populates the jar, for Android Studio
// development - as it's not part of gradle sync you need to build it before writing your code on top of this library.
// Potential TODO: add a fallback in dependencies so gradle sync can resolve the BareKit download.
//
// Engine: V8 only. This line of the library runs on the BareKit 2.x releases, whose Android prebuild
// ships V8 (the `android/` dir of prebuilds.zip). BareKit 3.x is a different distribution (no
// prebuilds.zip; Android arrives through bare-stow + bare-kit-kotlin) and is adopted in phase 3b of
// tetherto/wdk-worklet-bundler#84, so 3.x tags are rejected here. To run another engine (QuickJS, JSC)
// build BareKit 2.x yourself and point -PbareKitDir at it — not recommended, see README.md Step 2.
//
// Overrides: -PbareKitDir=<path> (use a pre-provisioned copy, including your own BareKit build),
// -PbareKitTag=v2.<minor>.<patch> (pin a 2.x release instead of the newest one).

// Removed with the move to V8 only. Fail at configuration time so a stale script or
// gradle.properties entry is noticed instead of silently fetching V8.
if (project.hasProperty('bareKitEngine')) {
    throw new GradleException("-PbareKitEngine was removed: wdk-core-kotlin is V8 only on BareKit 2.x. " +
        "To use your own BareKit build (e.g. QuickJS), point -PbareKitDir at it. See README.md, Step 2.")
}
if (bareKitTag != null && !(bareKitTag ==~ /v2\.\d+\.\d+/)) {
    throw new GradleException("-PbareKitTag=${bareKitTag} is not a BareKit 2.x release tag (expected v2.<minor>.<patch>). " +
        "BareKit 3.x publishes no prebuilds.zip and needs bare-stow; it arrives in phase 3b of " +
        "tetherto/wdk-worklet-bundler#84. See README.md, Step 2.")
}

tasks.register('fetchBareKit') {
    description 'Fetch BareKit classes.jar + native libs (V8) from a 2.x GitHub release if missing.'
    outputs.dir bareKitDir
    // onlyIf is evaluated on EVERY run — including the very first, before Gradle has any task
    // history. A present jar therefore always skips the task.
    // Delete libs/bare-kit to force a re-fetch, e.g. after changing -PbareKitTag.
    onlyIf { !bareKitClassesJar.exists() }
    doLast {
        // An explicit -PbareKitDir is the user's own copy (README.md, Step 2): it is never downloaded
        // into, deleted or overwritten. Fail instead of fetching V8 over it.
        if (project.hasProperty('bareKitDir')) {
            throw new GradleException("-PbareKitDir=${bareKitDir}: classes.jar not found there. " +
                "-PbareKitDir never downloads; it must hold BareKit's Android files in the layout from README.md, Step 2.")
        }
        // Small JSON calls against the GitHub REST API. Accept selects GitHub's JSON media type;
        // User-Agent is required. Unauthenticated: public repo, well within the rate limit.
        def github = { String path ->
            def api = new URL("https://api.github.com/repos/holepunchto/bare-kit/${path}").openConnection()
            api.setRequestProperty('User-Agent', 'wdk-core-kotlin-build')
            api.setRequestProperty('Accept', 'application/vnd.github+json')
            new groovy.json.JsonSlurper().parse(api.inputStream)
        }

        // 1) Resolve the release: the pinned 2.x tag, or else the newest 2.x release. "latest" is
        //    NOT used on purpose — it points at 3.x, which has no prebuilds.zip (see above).
        def release
        if (bareKitTag) {
            logger.lifecycle("fetchBareKit: resolving pinned release ${bareKitTag}")
            release = github("releases/tags/${bareKitTag}")
        } else {
            logger.lifecycle("fetchBareKit: resolving the newest BareKit 2.x release")
            def v2 = github("releases?per_page=100").findAll {
                it.tag_name ==~ /v2\.\d+\.\d+/ && !it.draft && !it.prerelease
            }
            if (v2.isEmpty()) {
                throw new GradleException("No BareKit 2.x release found via the GitHub API; pin one with -PbareKitTag=v2.<minor>.<patch>.")
            }
            // Highest semver wins (zero-padded components compare correctly as strings).
            release = v2.max { it.tag_name.substring(1).tokenize('.').collect { String.format('%05d', it as int) }.join('.') }
        }
        def asset = release.assets.find { it.name == 'prebuilds.zip' }
        if (asset == null) {
            throw new GradleException("prebuilds.zip not found in BareKit release ${release.tag_name}")
        }

        // 2) Download call: stream the actual zip bytes (buffered chunks, low RAM) to a temp FILE
        //    on disk (the OS temp dir, not build/) — nothing platform-specific reaches libs/bare-kit yet.
        def tmpZip = File.createTempFile('barekit-', '.zip')
        try {
            logger.lifecycle("fetchBareKit: downloading ${asset.name} (~${(asset.size / 1024 / 1024) as int} MB) from ${release.tag_name}")
            def download = new URL(asset.browser_download_url).openConnection()
            download.setRequestProperty('User-Agent', 'wdk-core-kotlin-build')
            download.inputStream.withStream { input -> tmpZip.withOutputStream { it << input } }

            // 3) Extract ONLY android/bare-kit/** (the V8 Android build) into libs/bare-kit — other
            //    platforms never reach that dir. If the dir isn't in the archive, fail listing what IS.
            def platformDir = 'android'
            def tree = zipTree(tmpZip)
            def wanted = tree.matching { include "${platformDir}/bare-kit/**" }
            if (wanted.isEmpty()) {
                def available = new TreeSet<String>()
                tree.visit { if (it.relativePath.segments.length > 0) available.add(it.relativePath.segments[0]) }
                throw new GradleException("'${platformDir}/' not found in ${asset.name} of ${release.tag_name}. Available: ${available.join(', ')}.")
            }
            delete bareKitDir
            copy {
                from(wanted) {
                    includeEmptyDirs = false
                    eachFile { it.path = it.path.replaceFirst("^${platformDir}/bare-kit/", '') }
                }
                into bareKitDir
            }
            logger.lifecycle("fetchBareKit: extracted ${platformDir}/bare-kit from ${release.tag_name} -> ${bareKitDir}")
        } finally {
            tmpZip.delete()
        }
    }
}

// AGP's jni merge reads libs/bare-kit/jni directly (sourceSets above), so it must be ordered after the
// fetch explicitly — the classes.jar `builtBy` below only orders the compile tasks.
preBuild.dependsOn fetchBareKit

dependencies {
    api files(bareKitClassesJar) { builtBy 'fetchBareKit' }

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
